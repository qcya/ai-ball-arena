name: Apply v0.6.1 spectator and runtime audit fix
on:
  push:
    paths: ['.updates/v061.ready']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify patch, update sources, run tests and publish
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .updates/v061.ready ]; then
            echo 'Update already applied'; exit 0
          fi
          python3 - <<'PY'
          import base64,hashlib,json,lzma
          from pathlib import Path
          payload=Path('.updates/v061.patch.b64').read_text().strip()
          assert hashlib.sha256(payload.encode()).hexdigest() == 'a1b6ea13f78a3504974fe7138183c0512dc23a249838fa5db5df4b06b595f0f5'
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'af87b684192c8ed0f19b57b07661db3e66b6ed835e44f244e1f82e0153cbfe28'
          allowed={'AI_TASK.md','CHANGELOG.md','README.md','RULES_AND_INTERFACE.md','tools/check-agent.cjs'}
          files=json.loads(raw)['files']
          assert len(files)==17
          prepared=[]
          for f in files:
              path=Path(f['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path) in allowed or path.parts[0] in {'src','tests'}
              if f['base'] is None:
                  assert not path.exists(),str(path)
                  old=''
              else:
                  assert path.exists(),str(path)
                  b=path.read_bytes()
                  sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                  assert sha==f['base'],f'Base changed: {path}'
                  old=b.decode('utf-8')
              result=old
              for start,end,replacement in reversed(f['ops']):
                  assert 0<=start<=end<=len(old)
                  result=result[:start]+replacement+result[end:]
              assert hashlib.sha256(result.encode('utf-8')).hexdigest()==f['sha256'],str(path)
              prepared.append((path,result))
          for path,value in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(value,encoding='utf-8')
          print('Verified and patched',len(prepared),'files')
          PY
          npm test
          npm run soak
          python3 build.py
          git diff --check
          rm -f .updates/v061.ready .updates/v061.patch.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stable six-agent spectator layout and worker timeout handling'
          git push origin HEAD:main
