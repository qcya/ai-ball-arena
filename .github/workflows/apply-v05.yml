name: Publish verified v0.5
on:
  push:
    paths: ['.updates/v05.ready']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate exact base and apply checked source
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('.updates').glob('v05.part-*.b64'))
          assert len(parts) == 3, 'Missing transfer part'
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'b831c8fe69aeab974ae51cf0caa31d8278ff58ccfc9d7fd767525808722d8b54', 'Transfer checksum mismatch'
          files = json.loads(raw)['files']
          assert len(files) == 35
          prepared = []
          roots = {'AGENTS.md','AI_ENTRY_PROMPT.md','AI_TASK.md','CHANGELOG.md','QUICK_START.txt','README.md','RULES_AND_INTERFACE.md','build.py','package.json'}
          for f in files:
              path = Path(f['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert str(path) in roots or path.parts[0] in {'src','tests','docs','examples','tools'}, 'Unexpected path'
              if f['base'] is None:
                  assert not path.exists(), 'New path already exists: ' + str(path)
                  old = ''
              else:
                  b = path.read_bytes()
                  sha = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
                  assert sha == f['base'], 'Remote file changed; refusing overwrite: ' + str(path)
                  old = b.decode('utf-8')
              result = old
              for start, end, text in reversed(f['ops']):
                  assert 0 <= start <= end <= len(old)
                  result = result[:start] + text + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == f['sha256'], 'Result checksum mismatch: ' + str(path)
              prepared.append((path, result))
          for path, text in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print('Verified and applied', len(prepared), 'source files')
          PY
      - name: Check rules, full matches, contract examples and offline artifact
        run: |
          npm test
          npm run soak
          python3 build.py
          node tools/check-agent.cjs examples/solo.js examples/team.js examples/storm.js
          git diff --check
          test "$(sha256sum index.html | cut -d' ' -f1)" = "76217dc307ca9c66999853820bef81a2f8260ef01c8573fb1c03a59137ab0049"
      - name: Publish tested source and remove transfer parts
        run: |
          rm -f .updates/v05.part-*.b64 .updates/v05.ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.5 import independent AI scripts and team fragment feeding'
          git push origin HEAD:main
