name: Build standalone spectator v0.8
on:
  push:
    paths: ['.github/workflows/build-v08.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify game and build complete offline site
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run soak
          python3 build.py
          git diff --check
          test -s index.html
          test -s '球球竞技场.html'
      - name: Publish build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '球球竞技场.html'
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish v0.8 offline spectator HTML'
            git push origin HEAD:main
          fi
