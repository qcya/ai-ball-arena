name: Apply verified v0.4 update
on:
  push:
    paths: ['.updates/v04.ready']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate base files and apply checked source changes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('.updates').glob('v04.part-*.b64'))
          assert len(parts) == 3, 'Missing update part'
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '41e7a12531e098d8fd727a5529f9de2af6b50af71208b15108bbadc2f075dde0', 'Update checksum mismatch'
          files = json.loads(raw)['files']
          prepared = []
          roots = {'README.md','RULES_AND_INTERFACE.md','AI_ENTRY_PROMPT.md','QUICK_START.txt','CHANGELOG.md','package.json','build.py'}
          for f in files:
              path = Path(f['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert str(path) in roots or path.parts[0] in {'src','tests','docs'}, 'Unexpected path'
              if f['base'] is None:
                  assert not path.exists(), 'New path already exists: ' + str(path)
                  old = ''
              else:
                  b = path.read_bytes()
                  sha = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
                  assert sha == f['base'], 'Remote file changed; refusing overwrite: ' + str(path)
                  old = b.decode('utf-8')
              result = old
              for start, end, text in reversed(f['ops']):
                  assert 0 <= start <= end <= len(old)
                  result = result[:start] + text + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == f['sha256'], str(path)
              prepared.append((path, result))
          for path, text in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print('Verified and applied', len(prepared), 'source files')
          PY
      - name: Test game rules and full rounds, then build offline HTML
        run: |
          npm test
          npm run soak
          python3 build.py
          git diff --check
      - name: Publish tested v0.4 source and remove transfer parts
        run: |
          rm -f .updates/v04.part-*.b64 .updates/v04.ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.4 smooth camera interpolation, reward thorns and recoverable bait'
          git push origin HEAD:main
