name: Finalize reproducible v0.4 build
on:
  push:
    paths: ['build.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify rules and build exact offline artifact
        run: |
          npm test
          python3 build.py
          git diff --check
          test "$(git hash-object index.html)" = "711187fa3003b351e524cc6ddb9f23230980d268"
      - name: Publish generated HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html '球球竞技场.html'
          if ! git diff --cached --quiet; then
            git commit -m 'build: reproducible v0.4 offline game'
            git push origin HEAD:main
          fi
