name: Publish verified spectator v0.7
on:
  push:
    paths: ['.updates/v07.ready']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify and apply v0.7 presentation-only patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,base64,lzma,hashlib
          from pathlib import Path
          payload=Path('.updates/v07.patch.b64').read_text().strip()
          assert hashlib.sha256(payload.encode()).hexdigest() == '92ef9ac4f4939c2295b74ea5b7b110847d4dd482877596a67522f0901e21f9b9'
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f4981c8abdbb87b6df864925ebdfd36a19c31ffdc8aea870a3850fff4679a8ca'
          files=json.loads(raw)['files']
          allowed={'src/director.js','src/app.js','src/index.html','src/style.css','build.py','README.md','CHANGELOG.md','tests/broadcast_v07.test.cjs'}
          assert {x['path'] for x in files} == allowed
          prepared=[]
          for f in files:
              path=Path(f['path'])
              assert not path.is_absolute() and '..' not in path.parts
              if f['base'] is None:
                  assert not path.exists(),f'File already exists: {path}'
              else:
                  before=path.read_bytes()
                  sha=hashlib.sha1(b'blob '+str(len(before)).encode()+b'\0'+before).hexdigest()
                  assert sha==f['base'],f'Source modified on remote: {path}'
              out=f['text'].encode('utf-8')
              assert hashlib.sha256(out).hexdigest()==f['sha256'],str(path)
              prepared.append((path,out))
          for path,b in prepared:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(b)
          print('Patch verified:',len(prepared),'source files')
          PYCODE
      - name: Verify game invariants and build offline HTML
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run soak
          python3 build.py
          git diff --check
      - name: Publish and remove transfer files
        shell: bash
        run: |
          rm -f .updates/v07.ready .updates/v07.patch.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: cinematic 16:9 spectator camera, HUD and icon mini-map'
          git push origin HEAD:main
