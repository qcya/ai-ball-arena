name: Publish verified v0.6
on:
  push:
    paths: ['.updates/v06.ready']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate base files and apply verified source delta
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          parts = sorted(Path('.updates').glob('v06.part-*.b64'))
          assert len(parts) == 2, 'Missing update part'
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '101685e39ba24ea9bc95341854db7a69d3f99cec496fde01f6ed22f3bc7dbe61', 'Update checksum mismatch'
          files = json.loads(raw)['files']
          assert len(files) == 28
          roots = {'README.md','RULES_AND_INTERFACE.md','AI_TASK.md','AI_ENTRY_PROMPT.md','QUICK_START.txt','CHANGELOG.md','package.json'}
          prepared = []
          for f in files:
              path = Path(f['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert str(path) in roots or path.parts[0] in {'src','tests','docs'}, 'Unexpected path'
              if f['base'] is None:
                  assert not path.exists(), 'New file already exists: ' + str(path)
                  old = ''
              else:
                  b = path.read_bytes()
                  sha = hashlib.sha1(b'blob ' + str(len(b)).encode() + b'\0' + b).hexdigest()
                  assert sha == f['base'], 'Remote file changed, refusing overwrite: ' + str(path)
                  old = b.decode('utf-8')
              result = old
              for start, end, text in reversed(f['ops']):
                  assert 0 <= start <= end <= len(old)
                  result = result[:start] + text + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == f['sha256'], 'Result checksum mismatch: ' + str(path)
              prepared.append((path, result))
          for path, text in prepared:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          print('Applied', len(prepared), 'verified source files')
          PY
      - name: Verify mechanisms, full matches, API compatibility and offline build
        run: |
          npm test
          npm run soak
          node tools/check-agent.cjs examples/solo.js examples/team.js examples/storm.js
          python3 build.py
          git diff --check
          test "$(sha256sum index.html | cut -d' ' -f1)" = "f0f2dbc5800cbb23f67ab571c9e14121e5fc873dc15bbb11bdf53f1ee9e7de89"
      - name: Publish verified source without changing contestant files
        run: |
          rm -f .updates/v06.part-*.b64 .updates/v06.ready
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v0.6 survival results and continuous per-cell speed'
          git push origin HEAD:main
